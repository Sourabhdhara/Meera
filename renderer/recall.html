<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>Meera Memory Core</title>
  <link rel="stylesheet" href="./window-theme.css">
  <link rel="stylesheet" href="./settings.css">
  <link rel="stylesheet" href="./recall.css">
</head>
<body>
  <main class="settings recall-window">
    <header class="wizard-header">
      <div class="panel-heading">
        <button class="wizard-back" type="button" data-wizard-back aria-label="Back to Wizard" title="Back to Wizard">←</button>
        <h1>Meera Memory Core</h1>
      </div>
      <button type="button" class="window-close" id="close" aria-label="Close Recall">×</button>
    </header>
    <div class="recall-toolbar">
      <span class="panel-meta" id="count">Saved recollections</span>
      <button type="button" class="recall-chip" id="seed" aria-expanded="false" aria-controls="seed-form">＋ Manual seed</button>
      <button type="button" class="recall-chip" id="refresh">Refresh</button>
    </div>
    <div id="content">
      <form id="seed-form" hidden>
        <fieldset>
          <legend>Memory archetype category</legend>
          <div class="category-grid" id="seed-categories"></div>
        </fieldset>
        <label for="memory-text">Recollection statement</label>
        <textarea class="field" id="memory-text" rows="3" required></textarea>
        <div class="seed-actions">
          <button type="button" class="recall-chip" id="cancel">Cancel</button>
          <button type="submit" class="action">Commit memory</button>
        </div>
      </form>
      <div class="recall-filters" id="filters" role="group" aria-label="Filter recollections"></div>
      <p id="recall-status" role="status">Loading recollections…</p>
      <ul class="recall-list" id="memories"></ul>
    </div>
  </main>
  <script src="./wizard-nav.js"></script>
  <script src="./recall.js"></script>
</body>
</html>
