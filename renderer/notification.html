<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .card {
      width: 100%;
      height: 100%;
      background: rgba(24, 24, 37, 0.95);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(203, 166, 247, 0.65);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(203, 166, 247, 0.25);
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #cba6f7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #6c7086;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .close-btn:hover {
      color: #f38ba8;
    }
    .message {
      font-size: 13px;
      line-height: 1.45;
      color: #cdd6f4;
      flex: 1;
      overflow-y: auto;
      word-break: break-word;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title" id="title">✨ MEERA Alert</div>
      <button class="close-btn" id="close" title="Dismiss">✕</button>
    </div>
    <div class="message" id="message">Notification message goes here...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const titleText = params.get('title') || 'MEERA Alert';
    const messageText = params.get('message') || 'Notification';
    const duration = parseInt(params.get('duration') || '6', 10);

    document.getElementById('title').textContent = titleText.startsWith('✨') ? titleText : `✨ ${titleText}`;
    document.getElementById('message').textContent = messageText;

    document.getElementById('close').addEventListener('click', () => {
      window.close();
    });

    if (duration > 0) {
      setTimeout(() => {
        window.close();
      }, duration * 1000);
    }
  </script>
</body>
</html>
